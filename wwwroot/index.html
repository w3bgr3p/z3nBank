<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>z3nBank | Treasury</title>
    <link rel="stylesheet" href="css/themes.css">
    <script src="design.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@4/dark.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/bank.css">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay">
    ⏳ Loading treasury data...
</div>

<div class='header'>
    <h1>z3nBank <span class="page-name">Treasury</span></h1>
    <div class='stats-bar'>
        <div class='stat-item'>
            <span class='stat-label'>Accounts:</span>
            <span class='stat-value' id='totalAccounts'>-</span>
        </div>
        <div class='stat-item'>
            <span class='stat-label'>Active:</span>
            <span class='stat-value' id='activeAccounts'>-</span>
        </div>
        <div class='stat-item'>
            <span class='stat-label'>Chains:</span>
            <span class='stat-value' id='totalChains'>-</span>
        </div>
        <div class='stat-item'>
            <span class='stat-label' title='Token amounts multiplied by API prices. Estimated value, before fees and slippage.'>Est. USD:</span>
            <span class='stat-value' id='totalValue'>$0</span>
        </div>
    </div>
    <div class="header-right">
        <button onclick="setDb()" title="Database settings · Ctrl+Shift+D">Database</button>
        <button onclick="importWallets()" title="Import wallets · Ctrl+Shift+I">Import</button>
        <button onclick="setPin()" title="Wallet PIN · Ctrl+Shift+P">PIN</button>
        <button id="treasuryTab" onclick="setDefiOpen(false)" role="tab" aria-selected="true">Treasury</button>
        <button id="defiToggle" onclick="setDefiOpen(true)" role="tab" aria-controls="defiPanel" aria-selected="false">DeFi</button>
        <select id="themeSelect" aria-label="Color theme" onchange="setBankTheme(this.value)">
            <option value="dark">Dark</option><option value="graphite">Graphite</option>
            <option value="light">Light</option><option value="hyper">Hyper</option>
        </select>
        <button onclick="showHelp()" title="Help · Ctrl+H">Help</button>
        <button onclick="toggleBankLogs()" aria-expanded="false" aria-controls="logsPanel" id="logsToggle">Logs</button>
    </div>
</div>

<div class='controls'>
    <button onclick="refreshData()">Refresh</button>
    <button onclick="toggleAutoRefresh()">Auto: <span id="autoStatus">OFF</span></button>
    <span class="toolbar-sep"></span>
    <label for="maxIdInput">Max ID</label>
    <input type="number" id="maxIdInput" value="100" min="10" max="10000" placeholder="Max ID">
    <button id="updateBalancesButton" onclick="updateBalances()" class="primary">Update Balances</button>
    <span id="balanceUpdateStatus" role="status" style="color: #8b949e;"></span>
    <div class="custom-multiselect" id="chainMultiselect">
        <div class="select-box" onclick="toggleMultiselect()">
            <span id="selectedChainsLabel">All Chains</span>
            <span class="arrow">▼</span>
        </div>
        <div class="checkboxes" id="chainCheckboxes">
        </div>
    </div>
    <span class="toolbar-sep"></span>
    <label for="destinationChainSelect">Bridge to</label>
    <select id="destinationChainSelect" style="padding: 4px 10px; font-size: 10px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-family: inherit;">
        <!-- Будет заполнено динамически -->
    </select>
    <label for="protocolSelect">Service</label>
    <select id="protocolSelect" style="padding: 4px 10px; font-size: 10px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-family: inherit;">
        <option value="Relay">Relay</option>
        <option value="LiFi">LiFi</option>
    </select>

    <label for="gasBoostInput">Gas +%</label>
    <input id="gasBoostInput" type="number" value="20" min="0" max="1000" step="0.01" required
           onchange="saveGasBoost()" title="Percentage added to current network gas price. 0 means network price." style="width: 75px;">
    <label for="thresholdInput">Min. USD</label>
    <input type="number" id="thresholdInput" value="0.1" min="0" max="1000" step="0.01" placeholder="Threshold" style="width: 80px; padding: 4px 8px; font-size: 10px; background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font-family: inherit;">

    <label style="margin-left: 10px; color: #8b949e; display: flex; align-items: center; gap: 5px;">
        <input type="checkbox" id="excludeStablesCheckbox" style="cursor: pointer;">
        Exclude Stables
    </label>
</div>

<div class="controls token-controls">
    <button id="clearTreasuryChainsButton" onclick="clearTreasuryChains()" disabled>Clear swap networks</button>
    <span id="treasuryChainSelectionInfo" role="status">Swap networks: all visible · select account IDs</span>
    <button id="clearTreasuryAccountsButton" onclick="clearTreasuryAccounts()" disabled>Clear accounts</button>
    <span id="treasuryAccountSelectionInfo" role="status">0 accounts selected</span>
    <button id="clearTokenSelectionButton" onclick="clearTreasuryTokens()" disabled>Clear token selection</button>
    <span id="tokenSelectionInfo" role="status"></span>
    <button id="swapSelectedTokenButton" onclick="swapSelectedToken()" disabled>Swap selected → native</button>
    <span id="tokenSwapStatus" role="status"></span>
    <button id="stopSwapsButton" class="danger" onclick="stopSwaps()" disabled>Stop swaps</button>
    <span id="swapOperationsStatus" role="status"></span>
</div>

<div class="main-content">
    <!-- LEFT SECTION: Table + Logs -->
    <div class="left-section">
        <!-- TABLE -->
        <div class='table-wrapper'>
            <div class='table-container' id='tableContainer'></div>
        </div>


    <!-- LOGS PANEL -->
    <div class="logs-panel" id="logsPanel" hidden aria-label="Logs">
        <div class="logs-header">
            <span class="logs-title">Logs</span>
            <div class="logs-controls">
                
                <button onclick="toggleLogsAutoRefresh()" style="display: none;">⏸️ <span id="logsAutoStatus">ON</span></button>
                <select id="logsLevelFilter" onchange="refreshLogs()">
                    <option value="">All Levels</option>
                    <option value="ERROR">ERROR</option>
                    <option value="WARNING">WARNING</option>
                    <option value="INFO">INFO</option>
                    <option value="SUCCESS">SUCCESS</option>
                </select>
                
                <select id="logsMachineFilter" onchange="refreshLogs()"  style="display: none;">
                    <option value="">Machines</option>
                </select>
                
                <select id="logsProjectFilter" onchange="refreshLogs()" style="display: none;">
                    <option value="">Projects</option>
                </select>
                
                <input type="number" id="logsLimitInput" value="50" min="10" max="200" style="width: 50px;" onchange="refreshLogs()">
                <button onclick="clearLogsServer()" class="danger" title="Clear logs">Clear</button>
                <button onclick="setBankLogsOpen(false)" aria-label="Close logs">Close</button>
            </div>
        </div>
        <div class="logs-content" id="logsContainer"></div>
    </div>
    </div>

    <!-- RIGHT SECTION: Sidebar Stats -->
    <div class="sidebar">
        <div class="sidebar-section">
            <h3>Tokens <span class="token-pick-hint">click to select / clear</span></h3>
            <div class="token-list" id="topTokens">
                <!-- Filled by JS -->
            </div>
        </div>

        <div class="sidebar-section">
            <h3>Chains Distribution</h3>
            <div class="chain-stats" id="chainStats">
                <!-- Filled by JS -->
            </div>
        </div>

        <div class="sidebar-section">
            <h3>Portfolio Summary</h3>
            <div id="portfolioSummary" style="font-size: 10px; color: #8b949e;">
                <!-- Filled by JS -->
            </div>
        </div>

        
    </div>
</div>

<div class='legend'>
    <span>Less</span>
    <div class='legend-item'><div class='legend-box' style='background: #161b22; border: 1px dashed #30363d;'></div></div>
    <div class='legend-item'><div class='legend-box' style='background: #0e4429;'></div></div>
    <div class='legend-item'><div class='legend-box' style='background: #006d32;'></div></div>
    <div class='legend-item'><div class='legend-box' style='background: #26a641;'></div></div>
    <div class='legend-item'><div class='legend-box' style='background: #39d353;'></div></div>
    <span>More</span>
</div>

<div class='tooltip' id='tooltip'>
    <div class='tooltip-header' id='tooltipHeader'></div>
    <div class='tooltip-address' id='tooltipAddress'></div>
    <div class='tooltip-content' id='tooltipContent'></div>
</div>

<script>
    // Inline test - if you see this in console, HTML is working
    console.log('=== INLINE SCRIPT LOADED ===');
    console.log('Location:', window.location.href);
    console.log('Origin:', window.location.origin);
</script>

<script src="gas.js"></script>
<script src="passwords.js"></script>
<script src="app.js"></script>
<script src="logs.js"></script>
<script src="ui-components.js"></script>
<script src="tokens.js"></script>
<script src="swaps.js"></script>
<script src="defi.js"></script>


<script>
   

   
    
</script>
</body>
</html>
